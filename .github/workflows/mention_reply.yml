name: Mention Reply Bot

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (stays within free X API read limits)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no replies posted)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Prevent overlapping runs from racing on the last-seen commit
concurrency:
  group: mention-reply
  cancel-in-progress: false

jobs:
  reply-mentions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mention bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HISTORY_FILE: data/history.json
          LAST_SEEN_FILE: data/last_seen_id.txt
        # Scheduled runs post live; only an explicit `dry_run=true` dispatch is a dry run.
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python mention_reply.py --dry-run
          else
            python mention_reply.py
          fi

      - name: Commit last-seen ID
        if: always()
        run: |
          git config user.name  "xINJ Bot"
          git config user.email "bot@xinj"
          git add data/last_seen_id.txt || true
          if git diff --cached --quiet; then
            echo "No change to last-seen ID."
            exit 0
          fi
          git commit -m "chore: update mention last-seen ID [skip ci]"
          # Race-safe push: rebase onto latest remote, retry with backoff
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed, retrying..."; sleep $((2 ** i))
          done
          echo "::error::Failed to push last-seen ID after retries"; exit 1
