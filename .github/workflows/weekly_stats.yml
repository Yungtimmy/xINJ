name: Weekly Injective Stats Bot

on:
  schedule:
    # Every Monday at 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no tweet)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  post-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated history.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TALIS_API_KEY: ${{ secrets.TALIS_API_KEY }}
          HISTORY_FILE: data/history.json
          OUTPUT_DIR: data
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Commit updated history
        if: always()
        run: |
          git config user.name  "xINJ Bot"
          git config user.email "bot@xINJ"
          git add data/history.json || true
          if git diff --cached --quiet; then
            echo "No history change to commit."
            exit 0
          fi
          git commit -m "chore: update weekly stats history [skip ci]"
          # Race-safe push: rebase onto latest remote, retry with backoff
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed, retrying..."; sleep $((2 ** i))
          done
          echo "::error::Failed to push history after retries"; exit 1
